<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Katana Legend">
<meta name="theme-color" content="#0b0d18">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}*,*::before,*::after{box-sizing:border-box}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Shep's Katana Legend</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shojumaru&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/* Layout: one-screen game. Full-bleed WebGL world behind everything; menu panel docks left (landscape) or bottom (portrait); battle HUD replaces menus during play. */
:root{
  --ink:#0b0d18;
  --lacquer:#141a2e;
  --panel:rgba(13,16,30,.88);
  --panel-2:rgba(24,29,52,.92);
  --line:rgba(240,195,90,.30);
  --paper:#f5ecd8;
  --muted:#b3ab97;
  --gold:#f2c45a;
  --gold-2:#ffe08c;
  --jade:#4fd6aa;
  --sakura:#ff8fc0;
  --hurt:#ff5a4e;
  --sky:#6fc6ff;
  --display:'Shojumaru','Zen Maru Gothic',Georgia,serif;
  --body:'Zen Maru Gothic',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
html,body{height:100%;}
body{background:var(--ink);color:var(--paper);font-family:var(--body);font-weight:500;overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;}
button:focus-visible{outline:3px solid var(--gold-2);outline-offset:2px;}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;z-index:0;}
#fx2d{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:2;}

/* ---------- menu shell ---------- */
#ui{position:fixed;inset:0;z-index:5;display:grid;grid-template-rows:auto minmax(0,1fr) auto;pointer-events:none;}
#ui>*{pointer-events:auto;}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding-top:calc(env(safe-area-inset-top,0px) + 10px);padding-bottom:8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:linear-gradient(180deg,rgba(8,10,20,.85),rgba(8,10,20,0));}
.brand{display:flex;align-items:center;gap:10px;min-width:0;}
.brand-mark{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none;
  background:radial-gradient(circle at 35% 30%,#ff7a54,#c8281e 60%,#7d1410);color:#fff4d6;font-size:22px;
  box-shadow:0 0 0 2px rgba(255,224,140,.6),0 6px 18px rgba(200,40,30,.45);}
.brand-name{font-family:var(--display);font-size:clamp(16px,2.4vw,24px);letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  text-shadow:0 2px 0 #000,0 0 18px rgba(255,180,80,.35);}
.res{display:flex;align-items:center;gap:8px;flex:none;}
.chip{display:inline-flex;align-items:center;gap:7px;padding:6px 12px 6px 8px;border-radius:999px;background:rgba(10,12,24,.8);
  border:1px solid var(--line);font-weight:900;font-variant-numeric:tabular-nums;font-size:15px;}
.chip i{width:18px;height:18px;border-radius:50%;display:block;flex:none;}
.chip.gold i{background:radial-gradient(circle at 35% 30%,#fff3b0,#f2c45a 45%,#a8761a);box-shadow:0 0 8px rgba(242,196,90,.6);}
.chip.steel i{border-radius:4px;transform:skewX(-12deg);background:linear-gradient(135deg,#f4f8ff,#9fb0c8 55%,#5b6a82);}
.icon-btn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:rgba(10,12,24,.8);font-size:20px;display:grid;place-items:center;}

#screen{overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
  width:min(600px,50vw);margin-left:max(12px,env(safe-area-inset-left,0px));
  padding-block:6px 18px;padding-left:4px;padding-right:4px;scrollbar-width:none;}
#screen::-webkit-scrollbar{display:none;}
@media (orientation:portrait){
  #screen{width:auto;margin-left:0;align-self:end;max-height:56vh;
    padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
    mask-image:linear-gradient(180deg,transparent 0,#000 22px);-webkit-mask-image:linear-gradient(180deg,transparent 0,#000 22px);padding-top:22px;}
}
.tabs{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;
  padding-top:8px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 8px);
  padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));
  background:linear-gradient(0deg,rgba(6,8,16,.96),rgba(6,8,16,.82));border-top:1px solid var(--line);}
.tab{border:0;background:transparent;border-radius:14px;padding:6px 2px;display:grid;justify-items:center;gap:2px;color:var(--muted);min-height:56px;}
.tab b{font-size:22px;line-height:1.1;font-weight:700;font-family:serif;}
.tab span{font-size:12px;font-weight:700;letter-spacing:.03em;white-space:nowrap;}
.tab[aria-current="true"]{color:var(--paper);background:linear-gradient(180deg,rgba(242,196,90,.22),rgba(242,196,90,.05));box-shadow:inset 0 0 0 1px var(--line);}
.tab[aria-current="true"] b{color:var(--gold-2);text-shadow:0 0 12px rgba(255,200,90,.6);}

/* ---------- panels ---------- */
.stack{display:grid;gap:12px;}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;position:relative;
  box-shadow:0 10px 30px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.04);}
.panel.hero{background:linear-gradient(135deg,rgba(120,24,24,.92),rgba(30,14,30,.92));border-color:rgba(255,190,90,.45);overflow:hidden;}
.panel.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,170,80,.45),rgba(255,170,80,0) 70%);pointer-events:none;}
.eyebrow{font-size:12px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);}
h1,h2,h3{margin:0;font-family:var(--display);font-weight:400;text-wrap:balance;letter-spacing:.01em;}
h2{font-size:clamp(22px,3vw,30px);line-height:1.15;}
h3{font-size:19px;line-height:1.2;}
p{margin:0;line-height:1.5;}
.muted{color:var(--muted);}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.between{justify-content:space-between;}
.btn{border:0;border-radius:14px;padding:12px 18px;min-height:50px;font-weight:900;font-size:16px;letter-spacing:.02em;
  background:linear-gradient(180deg,#2c3456,#1d2340);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12),0 4px 0 #0a0c18;}
.btn:active{transform:translateY(2px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12),0 2px 0 #0a0c18;}
.btn.primary{background:linear-gradient(180deg,#ffd877,#e9a72e);color:#2a1700;box-shadow:inset 0 0 0 1px rgba(255,255,255,.4),0 4px 0 #8a5a10,0 0 24px rgba(255,190,80,.35);}
.btn.red{background:linear-gradient(180deg,#ff6e55,#c9261c);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.3),0 4px 0 #6d0f0a;}
.btn.jade{background:linear-gradient(180deg,#5ff0c0,#1fa77c);color:#05261b;box-shadow:inset 0 0 0 1px rgba(255,255,255,.35),0 4px 0 #0c5a41;}
.btn[disabled]{opacity:.45;pointer-events:none;}
.btn.small{min-height:40px;padding:8px 12px;font-size:14px;border-radius:12px;}
.btn.wide{width:100%;}
.cost{display:inline-flex;gap:8px;align-items:center;font-variant-numeric:tabular-nums;}
.cost i{width:14px;height:14px;border-radius:50%;display:inline-block;vertical-align:-2px;}
.cost .g{background:radial-gradient(circle at 35% 30%,#fff3b0,#f2c45a 45%,#a8761a);}
.cost .s{border-radius:3px;transform:skewX(-12deg);background:linear-gradient(135deg,#f4f8ff,#9fb0c8 55%,#5b6a82);}

.bar{height:10px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--jade),#b6ffdf);}
.skill{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;}
.skill .glyph{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:22px;font-family:serif;font-weight:700;
  background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--gold-2);}
.skill .lvl{font-weight:900;font-variant-numeric:tabular-nums;font-size:15px;}
.skill .nm{font-weight:900;display:flex;justify-content:space-between;gap:8px;font-size:15px;margin-bottom:5px;}
.skill .nm small{color:var(--muted);font-weight:700;}

.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;}
.stat{background:rgba(255,255,255,.04);border-radius:12px;padding:10px;text-align:center;border:1px solid rgba(255,255,255,.06);}
.stat b{display:block;font-size:20px;font-weight:900;font-variant-numeric:tabular-nums;}
.stat span{font-size:11px;font-weight:900;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;}
@media (max-width:420px){.stats{grid-template-columns:repeat(2,minmax(0,1fr));}}

.blade{display:block;width:100%;height:auto;max-width:100%;}
.rar{font-weight:900;font-size:12px;letter-spacing:.12em;text-transform:uppercase;}
.rar.mythic,.name.mythic{background:linear-gradient(90deg,#ff5fb0,#b357ff,#5fd0ff,#ff5fb0);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 3s linear infinite;}
@keyframes shimmer{to{background-position:300% 0;}}

/* quest */
.chapter{display:grid;gap:10px;}
.ch-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;}
.ch-head .jp{font-family:serif;color:var(--gold);font-size:18px;}
.stages{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;}
@media (max-width:520px){.stages{grid-template-columns:minmax(0,1fr);}}
.stage{background:var(--panel-2);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:12px;display:grid;gap:8px;align-content:start;position:relative;}
.stage.boss{border-color:rgba(255,120,90,.55);background:linear-gradient(160deg,rgba(90,20,24,.95),rgba(24,20,40,.95));}
.stage.current{box-shadow:0 0 0 2px var(--gold),0 0 26px rgba(242,196,90,.35);}
.stage.locked{opacity:.55;}
.stage .no{font-family:var(--display);font-size:13px;color:var(--muted);}
.stage .nm{font-weight:900;font-size:16px;line-height:1.2;}
.stage .ti{font-size:12px;color:var(--muted);}
.stars{color:#5a5f78;letter-spacing:2px;font-size:16px;}
.stars b{color:var(--gold-2);text-shadow:0 0 10px rgba(255,210,100,.7);font-weight:400;}
.tag{display:inline-block;font-size:11px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:99px;}
.tag.boss{background:#c9261c;color:#fff;}
.tag.new{background:var(--jade);color:#04251a;}

/* collections */
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;}
@media (max-width:520px){.grid3{grid-template-columns:repeat(2,minmax(0,1fr));}}
.card{background:var(--panel-2);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:12px;display:grid;gap:6px;align-content:start;text-align:left;}
button.card{width:100%;}
.card.sel{box-shadow:0 0 0 2px var(--gold);}
.card.unknown{opacity:.6;}
.card .nm{font-weight:900;font-size:15px;line-height:1.2;}
.card small{color:var(--muted);font-weight:700;}
.swatch{display:flex;gap:4px;}
.swatch i{width:22px;height:22px;border-radius:7px;display:block;border:1px solid rgba(255,255,255,.2);}
.train-card{display:grid;grid-template-columns:56px minmax(0,1fr);gap:12px;align-items:start;}
.train-card .glyph{width:56px;height:56px;font-size:28px;border-radius:14px;display:grid;place-items:center;font-family:serif;font-weight:700;color:#2a1700;
  background:linear-gradient(180deg,#ffd877,#e9a72e);box-shadow:0 0 20px rgba(255,190,80,.25);}

/* ---------- battle HUD ---------- */
#hud{position:fixed;inset:0;z-index:6;pointer-events:none;}
#hud button{pointer-events:auto;}
.hud-top{position:absolute;left:0;right:0;top:0;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:start;
  padding-top:calc(env(safe-area-inset-top,0px) + 10px);
  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));}
.fighter{display:flex;gap:8px;align-items:flex-start;min-width:0;}
.fighter.foe{flex-direction:row-reverse;text-align:right;}
.doll{width:46px;height:62px;flex:none;filter:drop-shadow(0 2px 3px rgba(0,0,0,.6));}
.fbars{flex:1;min-width:0;max-width:360px;display:grid;gap:4px;}
.fname{font-family:var(--display);font-size:clamp(14px,2vw,19px);text-shadow:0 2px 0 #000,0 0 10px rgba(0,0,0,.8);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.fname small{font-family:var(--body);font-weight:700;font-size:12px;color:var(--gold-2);margin-left:6px;}
.hp{height:16px;border-radius:5px;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.25);overflow:hidden;position:relative;transform:skewX(-14deg);}
.hp i,.hp em{position:absolute;left:0;top:0;bottom:0;display:block;}
.hp em{background:#fff3c4;transition:width .6s ease .25s;}
.hp i{background:linear-gradient(180deg,#8dffb8,#22b26a);transition:width .12s;}
.foe .hp i{background:linear-gradient(180deg,#ff9b7a,#d22a1c);}
.foe .hp i,.foe .hp em{left:auto;right:0;}
.spirit{height:8px;border-radius:4px;background:rgba(0,0,0,.6);overflow:hidden;transform:skewX(-14deg);border:1px solid rgba(255,255,255,.15);}
.spirit i{display:block;height:100%;width:0;background:linear-gradient(90deg,#6fc6ff,#d58bff);transition:width .15s;}
.spirit.full i{background:linear-gradient(90deg,#ffe08c,#ff8fc0,#6fc6ff);animation:pulse .6s ease-in-out infinite alternate;}
@keyframes pulse{from{filter:brightness(1)}to{filter:brightness(1.6)}}
.hud-mid{display:grid;justify-items:center;gap:6px;}
#stageLbl{font-family:var(--display);font-size:13px;color:var(--gold-2);text-shadow:0 2px 0 #000;white-space:nowrap;}
.hud-btns{display:flex;gap:6px;}
.hud-btn{border:1px solid rgba(255,255,255,.25);background:rgba(8,10,20,.65);border-radius:10px;padding:6px 10px;font-size:12px;font-weight:900;min-height:34px;}
#banner{position:absolute;left:0;right:0;top:26%;text-align:center;font-family:var(--display);font-size:clamp(38px,8vw,92px);
  color:#fff6d8;-webkit-text-stroke:2px #3a0d00;text-shadow:0 6px 0 #3a0d00,0 0 40px rgba(255,160,60,.8);opacity:0;pointer-events:none;letter-spacing:.02em;}
#banner.show{animation:bannerPop 1.1s cubic-bezier(.2,1.4,.4,1) forwards;}
#banner small{display:block;font-size:.32em;-webkit-text-stroke:0;text-shadow:0 2px 0 #000;color:var(--gold-2);margin-top:6px;}
@keyframes bannerPop{0%{opacity:0;transform:scale(2.2)}18%{opacity:1;transform:scale(.94)}28%{transform:scale(1.04)}36%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:scale(1.06)}}
#hint{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 20px);
  max-width:min(560px,60vw);text-align:center;font-weight:900;font-size:15px;padding:8px 14px;border-radius:12px;background:rgba(8,10,20,.65);
  border:1px solid rgba(255,255,255,.15);transition:opacity .3s;}
#hint:empty{opacity:0;}
#tInfo{position:absolute;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 12px);text-align:center;
  font-weight:900;font-size:16px;padding:8px 16px;border-radius:14px;background:rgba(8,10,20,.7);border:1px solid var(--line);white-space:nowrap;}
#tInfo:empty{display:none;}
#tInfo b{font-family:var(--display);font-weight:400;color:var(--gold-2);font-size:18px;margin-right:10px;}
.big-btn{position:absolute;width:clamp(96px,13vw,128px);height:clamp(96px,13vw,128px);border-radius:50%;font-weight:900;letter-spacing:.06em;font-size:15px;
  display:grid;place-items:center;text-align:center;line-height:1.1;touch-action:none;}
#blockBtn{left:calc(max(16px,env(safe-area-inset-left,0px)) + 8px);bottom:calc(env(safe-area-inset-bottom,0px) + 20px);
  border:3px solid rgba(160,210,255,.7);background:radial-gradient(circle at 40% 35%,rgba(90,140,220,.75),rgba(20,30,70,.8));
  box-shadow:0 0 0 6px rgba(0,0,0,.25),0 0 24px rgba(100,170,255,.35);color:#eaf4ff;}
#blockBtn.on{background:radial-gradient(circle at 40% 35%,rgba(160,210,255,.95),rgba(50,90,170,.9));box-shadow:0 0 0 6px rgba(0,0,0,.25),0 0 40px rgba(140,200,255,.9);transform:scale(.95);}
#specialBtn{right:calc(max(16px,env(safe-area-inset-right,0px)) + 8px);bottom:calc(env(safe-area-inset-bottom,0px) + 20px);
  border:3px solid rgba(255,220,140,.4);background:radial-gradient(circle at 40% 35%,rgba(90,70,40,.7),rgba(30,20,10,.8));color:rgba(255,240,210,.5);}
#specialBtn.ready{border-color:#ffe08c;color:#2a1200;background:radial-gradient(circle at 40% 35%,#fff2b8,#f2a92e 60%,#b4560e);
  box-shadow:0 0 0 6px rgba(0,0,0,.25),0 0 46px rgba(255,190,80,.95);animation:ready .7s ease-in-out infinite alternate;}
@keyframes ready{from{transform:scale(1)}to{transform:scale(1.08)}}
#hud.train .hud-mid{grid-column:3;justify-self:end;}
#hud.train .fighter,#hud.train #blockBtn,#hud.train #specialBtn,#hud.train #stageLbl{display:none;}
#hud.vs-local #blockBtn,#hud.vs-local #specialBtn,#hud.vs-online #specialBtn{display:none;}

/* ---------- overlays ---------- */
#overlay{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(4,5,12,.6);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px;overflow-y:auto;}
.modal{width:min(520px,100%);background:linear-gradient(180deg,#1a2038,#0f1324);border:1px solid var(--line);border-radius:22px;padding:22px;display:grid;gap:14px;
  box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 0 1px rgba(0,0,0,.6);text-align:center;animation:modalIn .4s cubic-bezier(.2,1.3,.4,1);}
@keyframes modalIn{from{opacity:0;transform:scale(.85) translateY(20px)}to{opacity:1;transform:none}}
.modal.win{background:linear-gradient(180deg,#3a1c10,#160d18);border-color:rgba(255,200,100,.6);}
.modal .kicker{font-family:var(--display);font-size:clamp(34px,6vw,54px);color:var(--gold-2);text-shadow:0 4px 0 #3a0d00,0 0 30px rgba(255,170,60,.6);line-height:1;}
.modal .kicker.lose{color:#cfd6ff;text-shadow:0 4px 0 #0a0c20,0 0 30px rgba(110,140,255,.5);}
.modal .actions{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));}
.reveal{position:relative;padding:18px 6px;border-radius:16px;overflow:hidden;background:radial-gradient(ellipse at center,rgba(255,255,255,.08),rgba(0,0,0,0) 70%);}
.reveal .rays{position:absolute;inset:-60%;background:repeating-conic-gradient(from 0deg,var(--rc,rgba(255,220,140,.22)) 0 8deg,transparent 8deg 22deg);animation:spin 9s linear infinite;}
@keyframes spin{to{transform:rotate(1turn)}}
.reveal .blade{position:relative;filter:drop-shadow(0 0 14px var(--glow,rgba(255,220,140,.6)));}
.rewards{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.07);}
.seg{display:flex;gap:4px;background:rgba(255,255,255,.06);padding:4px;border-radius:12px;flex-wrap:wrap;}
.seg button{border:0;background:transparent;padding:8px 10px;border-radius:9px;font-weight:900;font-size:13px;min-height:36px;}
.seg button[aria-pressed="true"]{background:var(--gold);color:#2a1700;}
.code{font-family:var(--display);font-size:44px;letter-spacing:.2em;color:var(--gold-2);text-shadow:0 0 20px rgba(255,200,80,.5);}
.keypad{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;}
.keypad button{min-height:52px;border-radius:12px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.06);font-weight:900;font-size:20px;}

#fade{position:fixed;inset:0;z-index:30;background:#05060c;opacity:0;pointer-events:none;transition:opacity .35s ease;}
#fade.on{opacity:1;pointer-events:auto;}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);transform:translateX(-50%) translateY(-20px);z-index:40;
  background:rgba(10,12,24,.95);border:1px solid var(--line);border-radius:14px;padding:10px 16px;font-weight:900;opacity:0;transition:.3s;pointer-events:none;max-width:90vw;text-align:center;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
#loading{position:fixed;inset:0;z-index:50;display:grid;place-items:center;text-align:center;
  background:radial-gradient(ellipse at 50% 60%,#5a1a12 0,#1a0c14 45%,#07070d 80%);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
#loading .sun{width:140px;height:140px;border-radius:50%;margin:0 auto 18px;background:radial-gradient(circle at 40% 35%,#ffb27a,#e2401f 55%,#7d1410);box-shadow:0 0 80px rgba(240,80,40,.6);position:relative;overflow:hidden;}
#loading .sun::after{content:"";position:absolute;left:-10%;right:-10%;top:58%;height:5px;background:#1a0c14;box-shadow:0 14px 0 #1a0c14,0 26px 0 #1a0c14;}
#loading h1{font-family:var(--display);font-size:clamp(30px,6vw,56px);font-weight:400;color:#fff1d0;text-shadow:0 4px 0 #3a0d00;}
#loading p{color:var(--gold-2);font-weight:900;margin-top:10px;}
#loading .err{color:#ffb4a8;max-width:440px;margin:14px auto 0;font-weight:700;}
@media (prefers-reduced-motion:reduce){#banner.show{animation-duration:1.4s}.reveal .rays,.rar.mythic,.name.mythic,#specialBtn.ready,.spirit.full i{animation:none}}
</style>

</head><body>
<canvas id="gl"></canvas>
<canvas id="fx2d"></canvas>

<div id="ui" hidden>
  <header class="topbar">
    <div class="brand"><span class="brand-mark" aria-hidden="true">刀</span><span class="brand-name">Shep's Katana Legend</span></div>
    <div class="res">
      <span class="chip gold" title="Gold"><i></i><b id="gold">0</b></span>
      <span class="chip steel" title="Steel"><i></i><b id="steel">0</b></span>
      <button class="icon-btn" id="settingsBtn" aria-label="Settings">⚙</button>
    </div>
  </header>
  <main id="screen"></main>
  <nav class="tabs" aria-label="Game menu">
    <button class="tab" data-tab="dojo"><b>道</b><span>Dojo</span></button>
    <button class="tab" data-tab="quest"><b>旅</b><span>Quest</span></button>
    <button class="tab" data-tab="train"><b>修</b><span>Train</span></button>
    <button class="tab" data-tab="forge"><b>鍛</b><span>Forge</span></button>
    <button class="tab" data-tab="swords"><b>刀</b><span>Swords</span></button>
    <button class="tab" data-tab="outfits"><b>衣</b><span>Outfits</span></button>
    <button class="tab" data-tab="versus"><b>対</b><span>Versus</span></button>
  </nav>
</div>

<div id="hud" hidden>
  <div class="hud-top">
    <div class="fighter me">
      <svg class="doll" id="dollMe" viewBox="0 0 46 62" aria-hidden="true"></svg>
      <div class="fbars">
        <div class="fname" id="meName">SHEP</div>
        <div class="hp"><em id="hpMeGhost"></em><i id="hpMe"></i></div>
        <div class="spirit" id="spWrap"><i id="spMe"></i></div>
      </div>
    </div>
    <div class="hud-mid">
      <div id="stageLbl"></div>
      <div class="hud-btns">
        <button class="hud-btn" id="viewBtn">View</button>
        <button class="hud-btn" id="leaveBtn">Leave</button>
      </div>
    </div>
    <div class="fighter foe">
      <svg class="doll" id="dollFoe" viewBox="0 0 46 62" aria-hidden="true"></svg>
      <div class="fbars">
        <div class="fname" id="foeName"></div>
        <div class="hp"><em id="hpFoeGhost"></em><i id="hpFoe"></i></div>
        <div class="spirit" id="spFoeWrap"><i id="spFoe"></i></div>
      </div>
    </div>
  </div>
  <div id="tInfo"></div>
  <div id="banner"></div>
  <div id="hint"></div>
  <button class="big-btn" id="blockBtn">BLOCK</button>
  <button class="big-btn" id="specialBtn">SPIRIT<br>STRIKE</button>
</div>

<div id="overlay" hidden></div>
<div id="fade"></div>
<div id="toast"></div>
<div id="loading">
  <div>
    <div class="sun"></div>
    <h1>Shep's Katana Legend</h1>
    <p id="loadMsg">Sharpening blades…</p>
  </div>
</div>

<script src="js/train.js"></script>
